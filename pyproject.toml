[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-seo-checker"
version = "0.2.0"
description = "Crawl an XML sitemap and audit every URL for status, canonical, robots, titles, hreflang and orphan pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["seo", "sitemap", "audit", "canonical", "hreflang", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://saizul.com"

[project.scripts]
sitemap-check = "sitemap_seo_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/sitemap_seo_checker/report.py" = ["E501"]
